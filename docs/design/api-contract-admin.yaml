openapi: 3.1.0
info:
  title: BYDP 博弈点评 · Admin API (v0.7)
  version: 0.7.0
  description: |
    运营后台接口契约 v0.2（D-015 #3，开发起草 2026-10-01，**协调官审定 2026-10-01**，可按此实现；Q1–Q4 裁定见 mailbox/to-dev「admin 契约审定」）。
    - v0.3.0（2026-10-03，D-016 结项，协调官认可）：新增 `GET /candidates`（Candidate 视图，按去刷加权排序）；`AdminComplaintDetail.screening`（投诉初筛建议）；`ReviewItem.proposal` 结构真源指向 packages/agents/src/schemas.ts；resolve 409 说明补 open_complaints / 死锁重试。
    - v0.4.0（2026-10-03，D-018，开发起草；协调官口径见 to-dev D-018，不再单独审）：新增 `GET /brands`、`POST /brands/{id}/status`（品牌状态变更，§9.2 v1.14）；
      重新验证清单加「品牌状态变更」；通知类型新增 `brand_status_changed`（订阅者 + 进行中案件投诉人）。
    - v0.4.1（2026-10-03，D-018 裁定 · §9.2 v1.15）：转入「平台认证」与「离开黑名单」只限 admin（仲裁员 403）；转认证须已登记 certifiedDepositUsdt（409 invalid_argument）；关联方品牌永不认证（409 related_party）；原因里后接金额单位的长数字不再视为个人信息。
    - v0.5.0（2026-10-04，A-018 落地 · §9.2 v1.15 / v1.17）：Offer 独立上下线状态——`GET /brands/{id}/offers`（arbitrator / admin 只读）、`POST /offers/{id}/status`（仅 admin，原因必填，写 audit）；
      品牌转黑名单时数据库同事务把该品牌 Offer 全部下线，解除黑名单不自动恢复；黑名单期间上线 → 409 invalid_transition。
    - v0.6.0（2026-10-20，D-025 · F4）：新增 `POST /complaints/{id}/operator-reply`（记录运营商答辩 → awaiting_reply 进入 arbitrating，此后可裁 resolved / unresolved / rejected）；二次通知（operator-notice which=second）同时给投诉人与订阅者写站内通知「已再次通知运营商，答辩期剩 X 天」。
    - v0.7.0（2026-10-20，D-024 · A-019）：提交审核——`GET /submissions?type=withdrawal|review&status=&amended=1`（出款凭证：arbitrator / admin；评价：editor / admin）、`POST /submissions/{type}/{id}/decision`（accept / reject；凭证无截图不能采纳；驳回须原因；采纳 / 发布发积分并通知本人）、`GET /submission-evidence/{id}/preview`（截图沙箱预览，同证据预览口径）。判定后补录的凭证带 `amendedAfterDecision`，可用 `amended=1` 筛选。
      数据库命名约束精确映射：brand_related_party_never_certified → 409 related_party；offer_blacklisted_brand_inactive → 409 invalid_transition。
    - 挂载：apps/api `/admin/v1/*`，**不进公开 OpenAPI 文档**；apps/admin 只调用本契约，不直连数据库（ADR-0005）。
    - 鉴权：与公开 API 相同的 Bearer（Auth.js 会话 JWT，epoch 校验）；**角色在 api 层按 `user_role` 校验**（§9.2 v1.7：core 不信任调用方传入的角色）。
      未登录 401 `{error:'unauthorized'}`；已登录无角色 / 越权 403 `Error{code:'forbidden'}`。网络层另加 Cloudflare Access（上线前置 #4，见 docs/ops/cloudflare-access.md，随实现补）。
    - 重新验证（审核 admin 第 1 轮）：**10 分钟内登录过**才可——确认曝光 / 公开与修订 / 角色变更 / 品牌状态变更 / 数据请求执行（redact · resolve · contact-confirmed）；其余后台请求须 **24 小时内登录过**；不满足返回 401 `reauth_required`（沿用 ReauthRequiredError）。
    - 回避：仲裁员 / admin 不得处理本人提交的案件——流转 / 通知 / 曝光 / 公开一律 409 `conflict_of_interest`。
    - 审计：**所有写操作**同事务写 audit_log（actorId = 会话用户、actorRole = 本次校验通过的角色、ip、before / after）；读操作不写。
    - 角色（DB `role_key` 枚举；D-015 文中 arbiter / bizdev 对应 arbitrator / commerce）：
        arbitrator 仲裁员 · editor 编辑（Agent 待确认队列 / CMS）· commerce 商务（本期无后台写权限，仲裁与商务物理隔离）· admin 管理员（全部 + 角色与隐私请求）。
    - 约定沿用公开契约：金额 USDT；时间 RFC 3339；分页 cursor；4xx 统一 Error 体。
servers:
  - url: https://api.{domain}/admin/v1
    variables: { domain: { default: bydp.example } }
security: [ { bearer: [] } ]
tags:
  - { name: session, description: 当前操作人与角色 }
  - { name: arbitration, description: 仲裁台（arbitrator / admin） }
  - { name: evidence, description: 证据预览与下载（arbitrator / admin） }
  - { name: privacy, description: 隐私数据请求处理（admin） }
  - { name: review, description: Agent 待人工确认队列（editor / admin；M3 第 4 项填内容） }
  - { name: brands, description: 品牌状态变更（arbitrator / admin；D-018） }
  - { name: risk, description: 风控（admin） }
  - { name: roles, description: 角色管理（admin） }
  - { name: dashboard, description: 看板（全部后台角色只读） }

paths:
  /session:
    get:
      tags: [session]
      summary: 当前操作人与角色（admin 前端据此显示菜单；真正的权限仍由各接口校验）
      responses:
        '200': { content: { application/json: { schema: { type: object, required: [userId, roles], properties: { userId: { type: string }, displayName: { type: string }, roles: { type: array, items: { $ref: '#/components/schemas/Role' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------- 仲裁台 ----------------
  /complaints:
    get:
      tags: [arbitration]
      summary: 案件队列（arbitrator / admin）。flag 由服务端计算：second_notice_due（答辩期剩 ≤ 72h 未发二次通知）· pending_exposure_decision（两次通知且期满）· awaiting_publish（结案未公开）
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ComplaintStatus' } }
        - { name: flag, in: query, schema: { type: string, enum: [second_notice_due, pending_exposure_decision, awaiting_publish] } }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200': { content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AdminComplaintRow' } }, next: { type: [string, 'null'] } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /complaints/{id}:
    get:
      tags: [arbitration]
      summary: 案件详情（含投诉原文、证据清单、处理记录、本案 audit_log）
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/AdminComplaintDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /complaints/{id}/transition:
    post:
      tags: [arbitration]
      summary: 状态流转（§9.2 状态机守卫照常生效）——screening → accepted | rejected（驳回原因必填，通知投诉人不公开）；arbitrating → resolved | rejected | unresolved；unresolved → exposed 走 /expose
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody: { content: { application/json: { schema: { type: object, required: [to], properties: { to: { type: string, enum: [accepted, rejected, resolved, unresolved] }, reason: { type: [string, 'null'], maxLength: 500 } } } } } }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/AdminComplaintDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 状态机拒绝（code = invalid_transition）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /complaints/{id}/operator-notice:
    post:
      tags: [arbitration]
      summary: 「已通知运营商」（§9.2 v1.7 人工口径）：first = 受理后首次（答辩期 7 天起算）；second = 答辩期内二次
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody: { content: { application/json: { schema: { type: object, required: [which, channel], properties: { which: { type: string, enum: [first, second] }, channel: { type: string, maxLength: 120, description: 经哪个官方渠道通知（如认领邮箱 / 官方 TG），写入 audit_log } } } } } }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/AdminComplaintDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 状态不符（code = invalid_transition）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /complaints/{id}/operator-reply:
    post:
      tags: [arbitration]
      summary: 记录运营商答辩（D-025）：仅「待答辩」且尚无答辩；写 operator_reply + operatorRepliedAt，状态进入 arbitrating（通知投诉人「进入仲裁」）；摘要选填、不公开
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { summary: { type: [string, 'null'], maxLength: 1000 } } } } } }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/AdminComplaintDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 状态不符 / 已记录过答辩, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /submissions:
    get:
      tags: [submissions]
      summary: 提交审核列表（D-024）：type=withdrawal（arbitrator / admin）或 review（editor / admin）；status 默认 pending；amended=1 只看判定后补录的凭证
      parameters:
        - { name: type, in: query, required: true, schema: { type: string, enum: [withdrawal, review] } }
        - { name: status, in: query, schema: { type: string, enum: [pending, accepted, rejected], default: pending } }
        - { name: amended, in: query, schema: { type: string, enum: ['1'] } }
      responses:
        '200': { description: 'items：凭证含 evidence[]（id / mime / bytes / sha256 / available）、bindingLevel、amendedAfterDecision；评价含 rating / text（仅后台可见）/ trustWeight' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /submissions/{type}/{id}/decision:
    post:
      tags: [submissions]
      summary: 判定（单向）：accept = 凭证采纳 / 评价发布（同事务发积分 withdrawal_report_accepted / review_published、写 audit、通知本人）；reject 须原因（通知本人）；凭证无可用截图不能采纳
      requestBody: { content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [accept, reject] }, reason: { type: [string, 'null'], maxLength: 500 } } } } } }
      responses:
        '200': { description: ok }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 已判定 / 无截图 / 驳回缺原因（code = invalid_transition）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /submission-evidence/{id}/preview:
    get:
      tags: [submissions]
      summary: 凭证截图沙箱预览（arbitrator / admin；不写 audit；PNG，同 /evidence/{id}/preview）
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses: { '200': { description: image/png }, '410': { description: 原文已删除 } }
  /complaints/{id}/expose:
    post:
      tags: [arbitration]
      summary: 人工确认转曝光（失联须两次通知 + 期满 + 无答辩；黑名单品牌受理后可直接曝光）；依据必填
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody: { content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 500 } } } } } }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/AdminComplaintDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 期满前 / 条件不足（code = invalid_transition）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /complaints/{id}/publish:
    post:
      tags: [arbitration]
      summary: 案件公开前人工确认脱敏（D-001 M3）：仲裁员逐项确认后置 publicSummary = true；公开页只显示脱敏后的陈述；**确认步骤同时展示 title**，四项清单对 title + publicDescription 一并核对
      description: |
        **Q1 裁定：方案 A。** 新增 `complaint.publicDescription`（≤ 500 字，迁移 A-014，db 双签）；本接口写入仲裁员编辑后的脱敏文本并置 publicSummary = true。
        **公开页与公开 API 只读 `publicDescription`，任何路径不得读 `description`**（core 层保证，补测试）。公开后可再次调用本接口修订脱敏文本（写 audit_log before/after），不能回退 publicSummary。
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody: { content: { application/json: { schema: { type: object, required: [publicDescription, checklist], properties: { title: { type: string, minLength: 1, maxLength: 80, description: '可选：公开前修订标题（标题也会显示在公开页，可能含姓名 / 联系方式）；修订写 audit_log before/after' }, publicDescription: { type: string, minLength: 1, maxLength: 500 }, checklist: { $ref: '#/components/schemas/RedactionChecklist' } } } } } }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/AdminComplaintDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 未结案（code = invalid_transition）/ 清单未全部确认（code = invalid_argument）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ---------------- 证据 ----------------
  /evidence/{id}/preview:
    get:
      tags: [evidence]
      summary: 沙箱预览（审核 D-015 #2 提醒）：服务端把图片 / PDF 首若干页转为 PNG 返回，页面内 <img> 显示；不向仲裁员下发原文件
      description: |
        图片重新编码（去 EXIF / 去元数据）后返回；PDF 由服务端渲染为位图（不执行内嵌脚本），默认前 5 页（?page=1..5）；纯文本转义后以 text/plain 返回。
        **Q2 裁定：sharp + poppler-utils（容器系统包）。** 渲染在子进程执行，单次超时 10s、输出 ≤ 2000px 宽；结果 PNG 可缓存到证据桶 `preview/<evidenceId>/<page>.png`（与原文同生命周期：原文删除 / 脱敏替换时一并删除）。预览不写 audit_log，下载写。
      parameters: [ { $ref: '#/components/parameters/id' }, { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 5, default: 1 } } ]
      responses:
        '200': { description: image/png 或 text/plain；带 X-Content-Type-Options nosniff、Cache-Control private no-store }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: 原文已删除（哈希仍在）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /evidence/{id}/download:
    get:
      tags: [evidence]
      summary: 原文下载（例外场景用，写 audit_log）：#21 响应头——attachment、文件名只用证据 id、nosniff、CSP default-src 'none' sandbox
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '200': { description: 原文字节流（Content-Type 按文件头判定，非白名单为 application/octet-stream） }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410': { description: 原文已删除, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ---------------- 隐私数据请求（§9.2 v1.9） ----------------
  /data-requests:
    get:
      tags: [privacy]
      summary: 数据请求队列（admin）
      parameters: [ { name: status, in: query, schema: { type: string, enum: [pending, done, rejected], default: pending } }, { $ref: '#/components/parameters/cursor' } ]
      responses:
        '200': { content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AdminDataRequest' } }, next: { type: [string, 'null'] } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /data-requests/{id}/redact:
    post:
      tags: [privacy]
      summary: 执行「证据原文脱敏」：admin 上传每份证据的脱敏版本替换原文（evidence.redacted = true；原 sha256 不变，另存 redactedSha256，A-014 加列）；替换后删除旧预览缓存
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody: { content: { multipart/form-data: { schema: { type: object, required: [evidenceId, file], properties: { evidenceId: { type: string }, file: { type: string, format: binary } } } } } }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/AdminDataRequest' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 证据不在本请求范围 / 已脱敏（code = invalid_argument）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /data-requests/{id}/resolve:
    post:
      tags: [privacy]
      summary: 结案（done / rejected，结果站内通知申请人）。delete_evidence：**未结案案件只能脱敏不能删原文**（v1.9），未结案时只能 rejected 或改走脱敏；anonymize：须先 /contact-confirmed；export：done 前由 worker 生成导出包（JSON，不含他人数据）存证据桶私有前缀，公开 API 另加 `GET /me/data-requests/{id}/download`（签名 URL，7 天），开发实现时在公开契约补该接口
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody: { content: { application/json: { schema: { type: object, required: [result], properties: { result: { type: string, enum: [done, rejected] }, note: { type: string, maxLength: 500, description: 驳回原因（通知申请人） } } } } } }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/AdminDataRequest' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 条件不满足（未结案删原文 / 注销未确认联系方式：code = invalid_argument；本人有未结案投诉：code = open_complaints；并发冲突（死锁 40P01）：code = invalid_argument「操作冲突，请重试」；self_excluded 自 0013 起不再返回）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /data-requests/{id}/contact-confirmed:
    post:
      tags: [privacy]
      summary: 注销执行前「经登记联系方式向本人确认一次」（v1.9）：写 `data_request.contactConfirmedAt / contactChannel`（A-014 加列）并写 audit_log，之后 /resolve done 才执行匿名化；只对 kind=anonymize 可调用
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody: { content: { application/json: { schema: { type: object, required: [channel], properties: { channel: { type: string, enum: [telegram, email] } } } } } }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/AdminDataRequest' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------- Agent 待人工确认队列（骨架） ----------------
  /review-queue:
    get:
      tags: [review]
      summary: Agent 输出待确认队列（editor / admin；表 `review_item`，A-014 新建）。M3 第 4 项填充来源；所有 Agent 输出只进本队列，不直接改公开数据；approve 的落地动作按 kind 由 core 执行并写 audit_log
      parameters: [ { name: kind, in: query, schema: { type: string, enum: [brand_attribute, site_monitor, complaint_screening, localization] } }, { $ref: '#/components/parameters/cursor' } ]
      responses:
        '200': { content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ReviewItem' } }, next: { type: [string, 'null'] } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /candidates:
    get:
      tags: [review]
      summary: Candidate 视图（D-016 第 6 项；editor / admin）：未收录标识按去刷加权排序（同 IP 网段一天只计 1 次；weightedPriority = 近 7 日 distinct 查询者，queryCount7d = 近 7 日查询者 × 天），只读
      responses:
        '200': { content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { type: object, properties: { id: { type: string }, identifierType: { type: string }, value: { type: string }, queryCount7d: { type: integer }, weightedPriority: { type: number }, firstQueried: { type: string, format: date }, status: { type: string } } } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /review-queue/{id}/decision:
    post:
      tags: [review]
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody: { content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [approve, reject] }, note: { type: string, maxLength: 500 } } } } } }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/ReviewItem' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------- 风控 / 角色 / 看板 ----------------
  /brands:
    get:
      tags: [brands]
      summary: 品牌列表（名称 / slug / id 搜索，最多 50 条，按 slug 排序）（arbitrator / admin）
      parameters: [ { name: q, in: query, schema: { type: string, maxLength: 80 } } ]
      responses:
        '200': { content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AdminBrand' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /brands/{id}/status:
    post:
      tags: [brands]
      summary: |
        变更品牌状态（arbitrator / admin；10 分钟内登录过）。v0.4.1：转入 certified 与 from = blacklist 的变更只限 admin（否则 403 forbidden）；仲裁员可转 blacklist、由 certified 转 watch。
        转 certified 前提：品牌所属运营商非关联方（否则 409 related_party）、certifiedDepositUsdt 非空（否则 409 invalid_argument）。
        v0.5.0：转入 blacklist 时该品牌全部 Offer 同事务置 offline；离开黑名单不恢复（见 /offers/{id}/status）。同事务：status / statusSince（UTC 日期）→ status_history（actor / reason）→ audit_log（before / after，含 evidenceCaseIds）。
        转入黑名单的连带：评分不对外（score = null，confidence = none）；Offer 列表与领码按品牌状态排除；新绑定拒绝。
        通知：订阅该品牌的用户 + 该品牌有进行中案件（screening / accepted / awaiting_reply / arbitrating）的投诉人，各一条 `brand_status_changed`（去重），提交后入队推送。
        文案（中性）：「{品牌} 的 BYDP 状态由 {旧} 变更为 {新}（{日期}）。依据：{reason 前 80 字}。查看：{站点}/brand/{slug}」；站点地址（SITE_URL）未配置或非 https 时省略「查看」。
        Offer 有独立状态（v0.5.0）：离开黑名单时 Offer 保持下线，须 admin 逐个上线。statusSince = 服务端 current_date（库时区 UTC）。
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [to, reason]
              properties:
                to: { $ref: '#/components/schemas/BrandStatus' }
                reason: { type: string, minLength: 1, maxLength: 500, description: 去首尾空白后不得为空；写入状态日志与通知（推送给订阅者）。含禁用措辞（保险 / 留存率 / 黑盘 / 跑路 / 骗子 / 骗局 / 诈骗）或个人信息（7 位以上数字串（后接 U / USDT / USD / 元 的金额除外）/ 邮箱 / @账号 / t.me 链接）→ 409 invalid_argument }
                evidenceCaseIds: { type: [array, 'null'], maxItems: 20, items: { type: string, pattern: '^[A-Za-z0-9_]{1,64}$' }, description: 依据案件，须为该品牌的案件；重复 id 自动去重 }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/AdminBrand' } } } }
        '400': { description: 参数错误 / 请求体不是 JSON（code = invalid_argument）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 未登录 / 超过 10 分钟（error = reauth_required） }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 与当前状态相同（code = invalid_transition）/ 关联方品牌转认证（code = related_party）/ 依据案件不属于该品牌、原因含禁用措辞或个人信息、未登记保证金（code = invalid_argument）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /brands/{id}/offers:
    get:
      tags: [brands]
      summary: 品牌的全部 Offer 与上线状态（arbitrator / admin）
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '200': { content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AdminOffer' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /offers/{id}/status:
    post:
      tags: [brands]
      summary: Offer 上线 / 下线（仅 admin；原因必填，写 audit before / after）。品牌在黑名单中时上线由数据库拒绝
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody: { content: { application/json: { schema: { type: object, required: [to, reason], properties: { to: { type: string, enum: [active, offline] }, reason: { type: string, minLength: 1, maxLength: 500 } } } } } }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/AdminOffer' } } } }
        '400': { description: 参数错误（code = invalid_argument）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 与当前状态相同 / 品牌在黑名单中不能上线（code = invalid_transition）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /risk/device-flags:
    get:
      tags: [risk]
      summary: 同设备多账号标记（来自 audit_log device_multi_account；只标不拦）（admin）
      parameters: [ { $ref: '#/components/parameters/cursor' } ]
      responses:
        '200': { content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { type: object, properties: { device: { type: string, description: 设备盲索引前 16 位 }, accounts: { type: integer }, userIds: { type: array, items: { type: string } }, lastFlaggedAt: { type: string, format: date-time } } } }, next: { type: [string, 'null'] } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/{id}/roles:
    get:
      tags: [roles]
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '200': { content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Role' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [roles]
      summary: 整体替换某用户的角色（admin）。仲裁与商务互斥：同一用户不能同时持 arbitrator 与 commerce（ADR-0003 物理隔离）；不能移除自己的 admin
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody: { content: { application/json: { schema: { type: object, required: [roles], properties: { roles: { type: array, items: { $ref: '#/components/schemas/Role' }, uniqueItems: true } } } } } }
      responses:
        '200': { content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Role' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 角色互斥 / 自我降权（code = invalid_argument）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /dashboard:
    get:
      tags: [dashboard]
      summary: 看板最简（全部后台角色只读）：待初筛 / 待通知 / 待决定曝光 / 待公开 / 数据请求待处理 / Agent 待确认 / 近 7 日多账号标记 计数
      responses:
        '200': { content: { application/json: { schema: { type: object, additionalProperties: { type: integer } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  parameters:
    id: { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    cursor: { name: cursor, in: query, schema: { type: string, maxLength: 256 } }
  responses:
    Unauthorized: { description: 未登录（不带 code）, content: { application/json: { schema: { type: object, properties: { error: { const: unauthorized } } } } } }
    Forbidden: { description: 无角色 / 越权（code = forbidden）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: 不存在（code = not_found）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    BrandStatus: { type: string, enum: [certified, watch, blacklist] }
    AdminOffer:
      type: object
      required: [id, brandId, title, status, validUntil, exclusive]
      properties:
        id: { type: string }
        brandId: { type: string }
        title: { type: string }
        status: { type: string, enum: [active, offline] }
        validUntil: { type: [string, 'null'], format: date }
        exclusive: { type: boolean }
    AdminBrand:
      type: object
      required: [id, slug, name, status, statusSince, subscribers, openComplaints]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string, description: name.zhHans }
        status: { $ref: '#/components/schemas/BrandStatus' }
        statusSince: { type: string, format: date }
        subscribers: { type: integer, description: 订阅该品牌的用户数（去重） }
        openComplaints: { type: integer, description: 进行中案件数 }
    Error:
      type: object
      required: [code, message]
      description: 与公开契约 Error 同形；admin 额外 code：forbidden · invalid_transition · conflict_of_interest
      properties:
        code: { type: string, enum: [forbidden, invalid_transition, invalid_argument, not_found, gone, conflict_of_interest, self_excluded, open_complaints] }
        message: { type: string }
    Role: { type: string, enum: [arbitrator, commerce, editor, admin] }
    ComplaintStatus: { type: string, enum: [screening, accepted, awaiting_reply, arbitrating, resolved, rejected, unresolved, exposed] }
    AdminComplaintRow:
      type: object
      properties:
        id: { type: string }
        brand: { type: object, properties: { id: { type: string }, slug: { type: string }, name: { type: string }, status: { type: string } } }
        status: { $ref: '#/components/schemas/ComplaintStatus' }
        category: { type: string }
        amountUsdt: { type: number }
        createdAt: { type: string, format: date-time }
        replyDeadline: { type: [string, 'null'], format: date-time }
        notices: { type: integer }
        flags: { type: array, items: { type: string, enum: [second_notice_due, pending_exposure_decision, awaiting_publish] } }
        publicSummary: { type: boolean }
        bindingLevel: { type: string, enum: [none, self_reported, postback_confirmed, operator_confirmed] }
    AdminComplaintDetail:
      allOf:
        - { $ref: '#/components/schemas/AdminComplaintRow' }
        - type: object
          properties:
            title: { type: string }
            description: { type: string, description: 投诉原文（仅后台可见） }
            publicDescription: { type: [string, 'null'], description: 当前公开陈述（未公开时 null；修订时回显） }
            eventDate: { type: string, format: date }
            evidence: { type: array, items: { type: object, properties: { id: { type: string }, type: { type: string }, sha256: { type: string }, redactedSha256: { type: [string, 'null'] }, redacted: { type: boolean }, originalAvailable: { type: boolean }, uploadedAt: { type: string, format: date-time } } } }
            timeline: { type: array, items: { type: object, properties: { at: { type: string, format: date-time }, to: { type: string }, actor: { type: string }, reason: { type: [string, 'null'] } } } }
            audit: { type: array, items: { type: object, properties: { at: { type: string, format: date-time }, actorId: { type: string }, actorRole: { type: [string, 'null'] }, action: { type: string } } } }
            screening: { type: [object, 'null'], description: 'D-016：投诉初筛建议（Agent 规则基线，最近一条 review_item；只是建议，不改案件状态）', properties: { reviewItemId: { type: string }, status: { type: string, enum: [pending, approved, rejected] }, suggest: { type: string, enum: [accept, reject, needs_info] }, rules: { type: array, items: { type: object, properties: { rule: { type: string }, note: { type: string } } } }, createdAt: { type: string, format: date-time } } }
    RedactionChecklist:
      type: object
      description: 公开前逐项确认（全部 true 才可公开）
      required: [noPersonalNames, noContactInfo, noAccountIds, noImagesWithFaces]
      properties:
        noPersonalNames: { type: boolean }
        noContactInfo: { type: boolean }
        noAccountIds: { type: boolean }
        noImagesWithFaces: { type: boolean }
    AdminDataRequest:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        kind: { type: string, enum: [redact_evidence, delete_evidence, export, anonymize] }
        status: { type: string, enum: [pending, done, rejected] }
        targets: { type: array, items: { type: object, properties: { evidenceId: { type: string }, complaintId: { type: string }, complaintClosed: { type: boolean }, redacted: { type: boolean }, originalAvailable: { type: boolean } } } }
        note: { type: [string, 'null'] }
        contactConfirmedAt: { type: [string, 'null'], format: date-time }
        contactChannel: { type: [string, 'null'], enum: [telegram, email, null] }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
    ReviewItem:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [brand_attribute, site_monitor, complaint_screening, localization] }
        subject: { type: string, description: 关联对象（brandId / identifierId / complaintId / contentId） }
        source: { type: string, description: 提案来源（Agent 名 / 采集源 URL 或任务 id），M3 第 4 项定义枚举 }
        proposal: { type: object, description: "Agent 提议，结构随 kind，真源 packages/agents/src/schemas.ts（zod：BrandAttributeProposal / SiteMonitorProposal / ComplaintScreeningProposal / LocalizationProposal）；外部抓取文本一律按纯文本展示" }
        status: { type: string, enum: [pending, approved, rejected] }
        createdAt: { type: string, format: date-time }
