services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: bydp, POSTGRES_PASSWORD: pass, POSTGRES_DB: bydp }
    ports: ["5432:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  meilisearch:
    image: getmeili/meilisearch:v1.10
    ports: ["7700:7700"]
    volumes: ["meili:/meili_data"]
volumes: { pg: {}, meili: {} }
